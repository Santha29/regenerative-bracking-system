<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    height: 330px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.pedal {
    width: 180px;
    height: 260px;

    border-radius: 28px;

    background: linear-gradient(
        180deg,
        #444444,
        #151515
    );

    border: 5px solid #777777;

    box-shadow:
        0 15px 30px rgba(0,0,0,0.5),
        inset 0 3px 8px rgba(255,255,255,0.15);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    color: white;

    cursor: pointer;

    user-select: none;

    transition:
        transform 0.08s,
        box-shadow 0.08s,
        border-color 0.08s;
}

.pedal:hover {
    border-color: #aaaaaa;
}

.pedal.pressed {
    transform: translateY(12px) scale(0.97);

    box-shadow:
        0 5px 10px rgba(0,0,0,0.5),
        inset 0 5px 10px rgba(0,0,0,0.5);

    border-color: #ff4444;
}

.icon {
    font-size: 55px;
}

.label {
    margin-top: 12px;
    font-size: 25px;
    font-weight: bold;
}

.status {
    margin-top: 10px;
    font-size: 16px;
}

.pressure {
    margin-top: 5px;
    font-size: 14px;
    opacity: 0.8;
}

</style>

</head>


<body>

<div class="container">

    <div
        class="pedal"
        id="pedal"
    >

        <div class="icon">
            🦶
        </div>

        <div class="label">
            BRAKE
        </div>

        <div
            class="status"
            id="status"
        >
            RELEASED
        </div>

        <div
            class="pressure"
            id="pressure"
        >
            0%
        </div>

    </div>

</div>


<script>

const pedal = document.getElementById("pedal");
const status = document.getElementById("status");
const pressure = document.getElementById("pressure");

let braking = false;


/*
---------------------------------------------------------
Streamlit message helper
---------------------------------------------------------
*/

function streamlitMessage(type, value) {

    window.parent.postMessage(
        {
            isStreamlitMessage: true,
            type: type,
            value: value
        },
        "*"
    );
}


/*
---------------------------------------------------------
Component ready
---------------------------------------------------------
*/

streamlitMessage(
    "streamlit:componentReady",
    null
);


/*
---------------------------------------------------------
Set component height
---------------------------------------------------------
*/

streamlitMessage(
    "streamlit:setFrameHeight",
    330
);


/*
---------------------------------------------------------
Send brake pressure
---------------------------------------------------------
*/

function sendBrakePressure(value) {

    value = Math.max(
        0,
        Math.min(100, value)
    );

    streamlitMessage(
        "streamlit:setComponentValue",
        value
    );

    pressure.innerText =
        Math.round(value) + "%";

    if (value > 0) {

        status.innerText = "BRAKING";

    } else {

        status.innerText = "RELEASED";

    }
}


/*
---------------------------------------------------------
Calculate pressure from mouse position
---------------------------------------------------------
*/

function calculatePressure(clientY) {

    const rect = pedal.getBoundingClientRect();

    const relativeY =
        clientY - rect.top;

    let percentage =
        (relativeY / rect.height) * 100;

    percentage =
        Math.max(
            0,
            Math.min(100, percentage)
        );

    return percentage;
}


/*
---------------------------------------------------------
Start braking
---------------------------------------------------------
*/

function startBrake(event) {

    event.preventDefault();

    braking = true;

    pedal.classList.add("pressed");

    updatePressure(event.clientY);
}


/*
---------------------------------------------------------
Update braking pressure
---------------------------------------------------------
*/

function updatePressure(clientY) {

    if (!braking) {
        return;
    }

    const value =
        calculatePressure(clientY);

    sendBrakePressure(value);
}


/*
---------------------------------------------------------
Mouse movement
---------------------------------------------------------
*/

pedal.addEventListener(
    "mousedown",
    startBrake
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (braking) {

            updatePressure(
                event.clientY
            );

        }

    }
);


/*
---------------------------------------------------------
Release brake
---------------------------------------------------------
*/

function releaseBrake() {

    if (!braking) {
        return;
    }

    braking = false;

    pedal.classList.remove("pressed");

    sendBrakePressure(0);
}


document.addEventListener(
    "mouseup",
    releaseBrake
);


/*
---------------------------------------------------------
Touch support
---------------------------------------------------------
*/

pedal.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        braking = true;

        pedal.classList.add("pressed");

        const touch =
            event.touches[0];

        updatePressure(
            touch.clientY
        );

    },
    { passive: false }
);


pedal.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

        if (!braking) {
            return;
        }

        const touch =
            event.touches[0];

        updatePressure(
            touch.clientY
        );

    },
    { passive: false }
);


document.addEventListener(
    "touchend",
    function() {

        releaseBrake();

    }
);


/*
---------------------------------------------------------
Keyboard support
---------------------------------------------------------
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" &&
            !event.repeat
        ) {

            event.preventDefault();

            braking = true;

            pedal.classList.add(
                "pressed"
            );

            sendBrakePressure(100);
        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            releaseBrake();

        }

    }
);


/*
---------------------------------------------------------
Initial state
---------------------------------------------------------
*/

sendBrakePressure(0);

</script>
</body>

</html>
